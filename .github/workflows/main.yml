name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'

jobs:
  deploy_functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No se instalan las dependencias del frontend: las Functions se
      # despliegan solas y `npm ci` en la raíz solo añadía tiempo y un
      # punto de fallo (exige package-lock.json perfectamente sincronizado).

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      # --force = despliega sin pedir confirmación Y borra automáticamente
      # las funciones que ya no existen en el código (como syncAdminClaim,
      # que se eliminó al quitar la colección de usuarios).
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only functions --project liga-de-san-mateo --force
